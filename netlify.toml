[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route /api/proxy to the function (also handled by function's config.path, belt + suspenders)
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

# SPA catch-all — must come LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
